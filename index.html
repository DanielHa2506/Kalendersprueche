<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reha-Motivation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #e8f3ef 0%, #d4e9f7 100%);
      color: #1f3a4d;
    }

    .karte {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(31, 58, 77, 0.12);
      padding: 2.5rem 2rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #47ac73;
      margin-bottom: 1.5rem;
    }

    .filter {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .chip {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1f3a4d;
      background: #eef3f1;
      border: 1px solid #d6e2dc;
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .chip:hover { background: #e0ebe5; }
    .chip:focus-visible { outline: 3px solid #a8d8bf; outline-offset: 2px; }

    .chip.aktiv {
      background: #47ac73;
      color: #ffffff;
      border-color: #47ac73;
    }

    blockquote {
      font-size: 1.6rem;
      line-height: 1.5;
      font-weight: 500;
      min-height: 4.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease;
    }

    button {
      margin-top: 2rem;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: #47ac73;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 2rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover { background: #3a9462; }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 3px solid #a8d8bf; outline-offset: 2px; }

    @media (max-width: 480px) {
      blockquote { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <main class="karte">
    <h1>Reha-Motivation</h1>
    <div class="filter" id="filter"></div>
    <blockquote id="spruch">…</blockquote>
    <button id="weiter" type="button">Nächster Spruch</button>
  </main>

  <script>
    const sprueche = [
      { text: "Jeder kleine Fortschritt zählt — auch der, den du heute kaum siehst.", kategorie: "Fortschritt" },
      { text: "Heilung ist kein Sprint, sondern viele geduldige Schritte.", kategorie: "Geduld" },
      { text: "Dein Körper erinnert sich an jede Übung, die du machst.", kategorie: "Fortschritt" },
      { text: "Nicht die Geschwindigkeit zählt, sondern dass du nicht stehen bleibst.", kategorie: "Durchhalten" },
      { text: "Was sich heute schwer anfühlt, wird morgen ein Stück leichter.", kategorie: "Geduld" },
      { text: "Sei stolz auf das, was du heute geschafft hast.", kategorie: "Fortschritt" },
      { text: "Ruhe ist Teil der Heilung — nicht das Gegenteil davon.", kategorie: "Ruhe" },
      { text: "Du bist stärker als die Ausrede, heute auszusetzen.", kategorie: "Durchhalten" },
      { text: "Vertrau dem Prozess: Dein Einsatz arbeitet für dich, auch in den Pausen.", kategorie: "Ruhe" },
      { text: "Ein Schritt nach dem anderen bringt dich ans Ziel.", kategorie: "Durchhalten" }
    ];

    const spruchEl = document.getElementById("spruch");
    const filterEl = document.getElementById("filter");

    let aktiveKategorie = "Alle";
    let letzterText = null;

    // Kategorien aus den Daten ableiten (Reihenfolge des ersten Auftretens), "Alle" voran
    const kategorien = ["Alle", ...sprueche.reduce((acc, s) => {
      if (!acc.includes(s.kategorie)) acc.push(s.kategorie);
      return acc;
    }, [])];

    function gefilterteSprueche() {
      return aktiveKategorie === "Alle"
        ? sprueche
        : sprueche.filter(s => s.kategorie === aktiveKategorie);
    }

    function zeigeZufallsspruch() {
      const liste = gefilterteSprueche();
      let spruch;
      do {
        spruch = liste[Math.floor(Math.random() * liste.length)];
      } while (spruch.text === letzterText && liste.length > 1);
      letzterText = spruch.text;
      spruchEl.textContent = "„" + spruch.text + "“";
    }

    function setzeKategorie(kategorie) {
      aktiveKategorie = kategorie;
      filterEl.querySelectorAll(".chip").forEach(chip => {
        chip.classList.toggle("aktiv", chip.dataset.kategorie === kategorie);
      });
      zeigeZufallsspruch();
    }

    kategorien.forEach(kategorie => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.dataset.kategorie = kategorie;
      chip.textContent = kategorie;
      chip.addEventListener("click", () => setzeKategorie(kategorie));
      filterEl.appendChild(chip);
    });

    document.getElementById("weiter").addEventListener("click", zeigeZufallsspruch);
    setzeKategorie("Alle");
  </script>
</body>
</html>
